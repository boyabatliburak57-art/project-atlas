appId: com.atlasfinance.mobile
name: TASK-110E Portfolio Position Institutional
---
- launchApp: { clearState: true }
- openLink: 'atlas:///portfolio/positions?fixture=1'
- openLink: 'atlas:///symbol/ASELS?fixture=1'
- scrollUntilVisible:
    {
      element: { id: 'company-institutional' },
      direction: DOWN,
      timeout: 60000,
      visibilityPercentage: 50,
    }
- assertVisible: { id: 'company-institutional' }

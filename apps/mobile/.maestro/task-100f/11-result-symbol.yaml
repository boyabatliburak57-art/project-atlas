appId: com.atlasfinance.mobile
name: Scan result to symbol detail
---
- launchApp: { clearState: true }
- openLink: 'atlas://scanner?fixture=1&view=results'
- extendedWaitUntil:
    visible: { id: 'scan-result-THYAO' }
    timeout: 60000
- tapOn: { id: 'scan-result-THYAO' }
- extendedWaitUntil:
    visible: 'Fiyat grafiği · 1M'
    timeout: 60000

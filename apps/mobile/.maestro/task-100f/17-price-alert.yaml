appId: com.atlasfinance.mobile
name: Price alert create
---
- launchApp: { clearState: true }
- openLink: 'atlas://watchlists?fixture=1&view=alert-create'
- openLink: 'atlas://watchlists?fixture=1&view=alert-create'
- assertVisible: { id: 'alert-builder' }
- assertVisible: 'PRICE'
- waitForAnimationToEnd
- tapOn:
    id: 'save-alert'
    retryTapIfNoChange: true
- assertVisible: { id: 'alerts-active' }

appId: com.atlasfinance.mobile
name: Scan progress and cancel
---
- launchApp: { clearState: true }
- openLink: 'atlas://scanner?fixture=1&view=progress'
- openLink: 'atlas://scanner?fixture=1&view=progress'
- waitForAnimationToEnd
- assertVisible: { id: 'cancel-scan' }
- tapOn:
    id: 'cancel-scan'
    retryTapIfNoChange: true
- assertVisible: { id: 'scan-history' }
- assertVisible: { id: 'history-cancelled' }

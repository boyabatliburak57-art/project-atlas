appId: com.atlasfinance.mobile
name: TASK-110F2 Symbol integration
---
- launchApp: { clearState: true }
- openLink: 'atlas:///symbol/ASELS?fixture=1'
- scrollUntilVisible:
    {
      element: { id: 'company-market-structure' },
      direction: DOWN,
      timeout: 60000,
      visibilityPercentage: 50,
    }
- assertVisible: { id: 'company-market-structure' }
- tapOn: { id: 'company-market-structure' }
- assertVisible: { id: 'market-measure-detail' }

appId: com.atlasfinance.mobile
name: Forgot and reset password contract
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Giriş yap'
    timeout: 120000
- openLink: 'atlas://forgot-password'
- extendedWaitUntil:
    visible: 'Şifremi unuttum'
    timeout: 30000
- waitForAnimationToEnd
- tapOn:
    id: 'auth-email'
    retryTapIfNoChange: true
- waitForAnimationToEnd
- inputText: 'mobile@example.test'
- runFlow:
    when:
      notVisible: 'mobile@example.test'
    commands:
      - tapOn: { id: 'auth-email', retryTapIfNoChange: true }
      - inputText: 'mobile@example.test'
- assertVisible: 'mobile@example.test'
- tapOn:
    text: 'Sıfırlama bağlantısı iste'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: 'Hesap uygunsa şifre sıfırlama talimatı gönderilecektir.'
    timeout: 30000
- openLink: 'atlas://reset-password?token=invalid-token-value-that-is-long-enough-0000'
- assertVisible: 'Yeni şifre'

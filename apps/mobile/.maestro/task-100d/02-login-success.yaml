appId: com.atlasfinance.mobile
name: Login success
---
- stopApp
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Giriş yap'
    timeout: 120000
- openLink: 'atlas:///login'
- extendedWaitUntil:
    visible: 'E-posta'
    timeout: 60000
- tapOn:
    id: 'auth-email'
- waitForAnimationToEnd
- inputText: 'mobile@example.test'
- runFlow:
    when: { notVisible: 'mobile@example.test' }
    commands:
      - tapOn: { id: 'auth-email' }
      - eraseText
      - inputText: 'mobile@example.test'
- tapOn:
    id: 'auth-password'
- waitForAnimationToEnd
- inputText: 'Atlas-Test-2026!'
- tapOn:
    id: 'auth-login-submit'
- waitForAnimationToEnd
- tapOn:
    text: 'Sonra'
    optional: true
- extendedWaitUntil:
    visible: 'Başlangıç ayarları'
    timeout: 60000
- assertVisible: 'Başlangıç ayarları'

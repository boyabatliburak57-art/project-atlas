appId: com.atlasfinance.mobile
name: Login success
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Giriş yap'
    timeout: 120000
- waitForAnimationToEnd
- tapOn:
    id: 'welcome-login'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: 'E-posta'
    timeout: 60000
- tapOn:
    id: 'auth-email'
- inputText: 'mobile@example.test'
- tapOn:
    id: 'auth-password'
- inputText: 'Atlas-Test-2026!'
- tapOn:
    text: 'Giriş yap'
    index: 1
- waitForAnimationToEnd
- repeat:
    times: 3
    commands:
      - tapOn:
          text: 'Sonra'
          optional: true
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: 'Başlangıç ayarları'
    timeout: 30000

appId: com.atlasfinance.mobile
name: Login invalid credentials
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Giriş yap'
    timeout: 120000
- waitForAnimationToEnd
- tapOn:
    id: 'welcome-login'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: 'E-posta'
    timeout: 30000
- tapOn:
    id: 'auth-email'
- inputText: 'missing@example.test'
- tapOn:
    id: 'auth-password'
- inputText: 'Wrong-Password-2026!'
- tapOn:
    text: 'Giriş yap'
    index: 1
- tapOn:
    text: 'Sonra'
    optional: true
- extendedWaitUntil:
    visible: 'Authentication failed'
    timeout: 30000

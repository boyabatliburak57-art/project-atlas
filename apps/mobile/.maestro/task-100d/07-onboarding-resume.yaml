appId: com.atlasfinance.mobile
name: Onboarding interruption contract
---
- stopApp
- launchApp:
    clearState: true
- extendedWaitUntil: { visible: 'Giriş yap', timeout: 120000 }
- openLink: 'atlas:///(onboarding)'
- waitForAnimationToEnd
- assertVisible: 'Ürün kapsamı ve yasal bildirimler'
- swipe:
    start: 50%, 70%
    end: 50%, 45%
    duration: 1000
- swipe:
    start: 50%, 45%
    end: 50%, 70%
    duration: 1000
- tapOn: { id: 'onboarding-disclosure-action' }
- extendedWaitUntil:
    visible: 'Dil, saat dilimi ve piyasa'
    timeout: 30000
- assertVisible: 'Daha sonra devam et'

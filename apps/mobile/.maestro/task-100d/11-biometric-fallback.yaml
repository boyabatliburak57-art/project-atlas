appId: com.atlasfinance.mobile
name: Biometric unavailable fallback
---
- launchApp:
    clearState: true
- extendedWaitUntil: { visible: 'Giriş yap', timeout: 120000 }
- openLink: 'atlas:///preferences'
- scrollUntilVisible:
    element:
      text: 'Biyometrik giriş'
    direction: DOWN
- assertVisible: 'Biyometrik giriş'
- assertVisible: 'Kapalı'

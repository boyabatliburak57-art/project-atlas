appId: com.atlasfinance.mobile
name: TASK-100K Reduced Motion critical surfaces
---
- launchApp: { clearState: false }
- openLink: 'atlas://component-catalog?mode=sheet'
- extendedWaitUntil: { visible: 'Component Catalog', timeout: 60000 }
- tapOn: { text: 'Bottom sheet aç', retryTapIfNoChange: true }
- extendedWaitUntil: { visible: { id: 'atlas-overlay-title' }, timeout: 30000 }
- tapOn: { id: 'atlas-overlay-close' }
- launchApp: { clearState: false }
- openLink: 'atlas://component-catalog?mode=dialog'
- extendedWaitUntil: { visible: 'Component Catalog', timeout: 60000 }
- tapOn: { text: 'Onay penceresini aç', retryTapIfNoChange: true }
- extendedWaitUntil: { visible: 'İşlemi onayla', timeout: 30000 }
- tapOn: 'Vazgeç'
- openLink: 'atlas://security?fixture=1&view=app-lock'
- assertVisible: { id: 'native-security-app-lock' }
- openLink: 'atlas://symbol/THYAO?fixture=1&tab=chart'
- assertVisible: 'Mum grafik etkileşim alanı'

appId: com.atlasfinance.mobile
name: TASK-110E Largest settlement decrease
---
- launchApp: { clearState: true }
- openLink: 'atlas:///markets/institutional/takas?fixture=1'
- tapOn: { id: 'takas-decrease' }
- scrollUntilVisible:
    {
      element: { id: 'settlement-row-ATY' },
      direction: DOWN,
      timeout: 60000,
      visibilityPercentage: 50,
    }
- assertVisible: { id: 'settlement-row-ATY' }

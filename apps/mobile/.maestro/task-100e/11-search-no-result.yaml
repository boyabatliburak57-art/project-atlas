appId: com.atlasfinance.mobile
name: Search no result
---
- launchApp: { clearState: true }
- openLink: 'atlas:///search?fixture=1'
- waitForAnimationToEnd
- assertVisible: { id: 'global-search' }
- tapOn:
    id: 'symbol-search-input'
    retryTapIfNoChange: true
- waitForAnimationToEnd
- inputText: 'ZZZZZZ'
- runFlow:
    when: { notVisible: 'ZZZZZZ' }
    commands:
      - tapOn: { id: 'symbol-search-input' }
      - eraseText
      - inputText: 'ZZZZZZ'
- hideKeyboard
- extendedWaitUntil: { visible: 'Sonuç bulunamadı.', timeout: 60000 }

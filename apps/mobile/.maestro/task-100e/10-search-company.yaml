appId: com.atlasfinance.mobile
name: Search company name
---
- launchApp: { clearState: true }
- openLink: 'atlas:///search?fixture=1'
- waitForAnimationToEnd
- assertVisible: { id: 'global-search' }
- tapOn:
    id: 'symbol-search-input'
    retryTapIfNoChange: true
- waitForAnimationToEnd
- inputText: 'Aselsan'
- extendedWaitUntil: { visible: { id: 'search-result-ASELS' }, timeout: 60000 }

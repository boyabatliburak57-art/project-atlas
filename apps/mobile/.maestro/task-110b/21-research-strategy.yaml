appId: com.atlasfinance.mobile
name: TASK-110B Research to Strategy Lab
---
- launchApp: { clearState: true }
- openLink: 'atlas:///(tabs)/research?fixture=1'
- waitForAnimationToEnd
- assertVisible: { id: 'feature-strategy-lab' }
- tapOn:
    id: 'feature-strategy-lab'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: { id: 'strategy-lab' }
    timeout: 60000

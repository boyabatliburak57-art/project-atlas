appId: com.atlasfinance.mobile
name: TASK-110B Research to Reports
---
- launchApp: { clearState: true }
- openLink: 'atlas://research?fixture=1'
- waitForAnimationToEnd
- assertVisible: { id: 'feature-reports' }
- tapOn:
    id: 'feature-reports'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: { id: 'operations-reports' }
    timeout: 60000

appId: com.atlasfinance.mobile
name: TASK-110B Research to Backtests
---
- launchApp: { clearState: true }
- openLink: 'atlas:///(tabs)/research?fixture=1'
- waitForAnimationToEnd
- assertVisible: { id: 'feature-backtests' }
- tapOn:
    id: 'feature-backtests'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: { id: 'strategy-result' }
    timeout: 60000

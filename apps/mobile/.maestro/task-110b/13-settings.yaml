appId: com.atlasfinance.mobile
name: TASK-110B profile Settings
---
- launchApp: { clearState: true }
- openLink: 'atlas:///profile?fixture=1'
- waitForAnimationToEnd
- assertVisible: { id: 'feature-settings' }

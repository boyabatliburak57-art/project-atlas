title = "Project Atlas Gitleaks Configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Generated and gitignored Next.js build artifacts; source files remain scanned"
paths = ['''(^|/)apps/web/\.next/''']

[[allowlists]]
description = "Native visual metadata contains only deterministic SHA-256 screenshot hashes"
paths = ['''(^|/)apps/mobile/src/test/visual/(baselines|current)/[^/]+/metadata\.json$''']

[[allowlists]]
description = "Generated CocoaPods lockfile contains dependency checksums, not credentials"
paths = ['''(^|/)apps/mobile/ios/Podfile\.lock$''']
